name: metal2

# SweetMetal2.bundle for iOS 16 arm64: Metal.framework's driver plugin on metal2vulkan + Turnip
# (metal/metal2, from ios-flame phone/metal2 + tools/build-m2v-bridge.sh, MIT). The bridge
# (UniXNU's, MIT) is a Rust static library over metal2vulkan (steelbrain/metal2vulkan at UniXNU's
# pin + metal/metal2/bridge/patches). Turnip itself comes from metal.yml (added when staging).

on:
  workflow_dispatch:
  push:
    branches: [bonito]
    paths:
      - "metal/metal2/**"
      - ".github/workflows/metal2.yml"

env:
  M2V_REPO: https://github.com/steelbrain/metal2vulkan
  M2V_SHA: 720ef1ce
  RUST: "1.98.0"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: |
          brew install llvm
          rustup toolchain install "$RUST" --profile minimal --target aarch64-apple-ios
          xcodebuild -version
      - name: metal2vulkan source
        run: |
          git clone -q "$M2V_REPO" m2v
          git -C m2v checkout -q "$M2V_SHA"
          git -C m2v log --oneline -1
          for p in metal/metal2/bridge/patches/*.patch; do
            echo "== $p"
            git -C m2v apply --whitespace=nowarn "$PWD/$p"
          done
      - name: Bridge
        run: |
          set -e
          OUT=$PWD/m2v-bridge; SRC=$PWD/m2v; mkdir -p $OUT
          LLVM_AS=$(brew --prefix llvm)/bin/llvm-as
          $LLVM_AS -o $OUT/runtime_examples.air $SRC/crates/metal2vulkan-validation/fixtures/public/examples/runtime_examples.ll
          $LLVM_AS -o $OUT/function_constant.air $SRC/crates/metal2vulkan-validation/fixtures/public/kernel_function_constant_gate_fold.ll
          cat > $OUT/Cargo.toml <<TOML
          [package]
          name = "native-metal-bridge"
          version = "0.1.0"
          edition = "2024"
          rust-version = "1.98"
          [workspace]
          [lib]
          crate-type = ["staticlib"]
          path = "$PWD/metal/metal2/bridge/NativeMetalBridge.rs"
          [dependencies]
          metal2vulkan = { path = "$SRC/crates/metal2vulkan", features = ["ash"] }
          metal2vulkan-runtime = { path = "$SRC/crates/metal2vulkan-runtime" }
          libc = "0.2"
          sha2 = { version = "0.10", features = ["asm"] }
          [profile.release]
          panic = "unwind"
          debug = 1
          TOML
          NMB_FIXTURE_AIR=$OUT/runtime_examples.air NMB_FC_AIR=$OUT/function_constant.air IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            cargo +$RUST build --release --manifest-path $OUT/Cargo.toml --target aarch64-apple-ios --target-dir $OUT/target
          ls -la $OUT/target/aarch64-apple-ios/release/libnative_metal_bridge.a
      - name: Bundle
        run: |
          set -e
          cd metal/metal2
          BRIDGE=$GITHUB_WORKSPACE/m2v-bridge/target/aarch64-apple-ios/release/libnative_metal_bridge.a
          CC="xcrun --sdk iphoneos clang -target arm64-apple-ios16.0"
          B=out/SweetMetal2.bundle
          mkdir -p $B
          $CC -x objective-c++ -std=c++17 -fobjc-arc -O2 -g -Wall -Wno-deprecated-declarations -Wno-unused-function -bundle \
            -o $B/SweetMetal2 SweetMetal2.mm NativeBridgeMetalFrontend.mm -x none "$BRIDGE" -Wl,-dead_strip -lc++ \
            -framework Foundation -framework Metal -framework IOSurface -framework IOKit -framework CoreFoundation
          dsymutil $B/SweetMetal2 -o out/SweetMetal2.dSYM || true
          strip -x $B/SweetMetal2
          cp Info.plist $B/Info.plist
          codesign -f -s - $B
          $CC -O2 -Wall -o out/m2vtest m2vtest.c "$BRIDGE" -Wl,-dead_strip
          strip -x out/m2vtest && codesign -f -s - out/m2vtest
          nm -m $B/SweetMetal2 | grep "weak external" | grep -v "dynamically looked up" || true
          otool -L $B/SweetMetal2
          ls -laR out
      - uses: actions/upload-artifact@v4
        with:
          name: metal2-ios
          path: metal/metal2/out/
